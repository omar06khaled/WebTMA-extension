<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" role="img">
<title>WebTMA assistant architecture running today</title>
<desc>The Chrome extension side panel calls a local FastAPI backend, which calls Create AI for the model and Supabase for the desk manual search.</desc>
<style>
text{font-family:"Segoe UI",Arial,sans-serif}
.h{font-size:16px;font-weight:600;fill:#2C2C2A}
.t{font-size:14px;font-weight:600}
.s{font-size:12px}
.lab{font-size:12px;fill:#5F5E5A}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.dash{fill:none;stroke:#B4B2A9;stroke-width:1;stroke-dasharray:4 4}
.p rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:1}.p .t{fill:#3C3489}.p .s{fill:#534AB7}
.g rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:1}.g .t{fill:#085041}.g .s{fill:#0F6E56}
.n rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:1}.n .t{fill:#444441}.n .s{fill:#5F5E5A}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="470" fill="#ffffff"/>
<text class="h" x="40" y="28">WebTMA assistant: what runs today (main branch)</text>
<g transform="translate(0,40)">
<rect class="dash" x="40" y="30" width="600" height="104" rx="12"/>
<text class="lab" x="56" y="50">Chrome extension (loaded unpacked)</text>
<g class="p"><rect x="70" y="64" width="220" height="52" rx="8"/><text class="t" x="180" y="82" text-anchor="middle" dominant-baseline="central">WebTMA page</text><text class="s" x="180" y="102" text-anchor="middle" dominant-baseline="central">Reads and fills the form</text></g>
<g class="p"><rect x="390" y="64" width="220" height="52" rx="8"/><text class="t" x="500" y="82" text-anchor="middle" dominant-baseline="central">Side panel</text><text class="s" x="500" y="102" text-anchor="middle" dominant-baseline="central">Suggest, rate, apply</text></g>
<line class="arr" x1="294" y1="90" x2="386" y2="90" marker-start="url(#a)" marker-end="url(#a)"/>
<line class="arr" x1="500" y1="118" x2="500" y2="166" marker-end="url(#a)"/>
<text class="lab" x="512" y="150">POST /api/suggest</text>
<rect class="dash" x="40" y="170" width="600" height="120" rx="12"/>
<text class="lab" x="56" y="190">FastAPI backend on localhost:3000 (VS Code Run and Debug)</text>
<g class="g"><rect x="60" y="212" width="170" height="56" rx="8"/><text class="t" x="145" y="230" text-anchor="middle" dominant-baseline="central">Layer 1</text><text class="s" x="145" y="250" text-anchor="middle" dominant-baseline="central">Buildings + task JSON</text></g>
<g class="g"><rect x="255" y="212" width="170" height="56" rx="8"/><text class="t" x="340" y="230" text-anchor="middle" dominant-baseline="central">Layer 2</text><text class="s" x="340" y="250" text-anchor="middle" dominant-baseline="central">Desk manual lookup</text></g>
<g class="g"><rect x="450" y="212" width="170" height="56" rx="8"/><text class="t" x="535" y="230" text-anchor="middle" dominant-baseline="central">Local files</text><text class="s" x="535" y="250" text-anchor="middle" dominant-baseline="central">audit, feedback logs</text></g>
<line class="arr" x1="232" y1="240" x2="253" y2="240" marker-end="url(#a)"/>
<line class="arr" x1="120" y1="270" x2="120" y2="338" marker-end="url(#a)"/>
<line class="arr" x1="300" y1="270" x2="235" y2="338" marker-end="url(#a)"/>
<line class="arr" x1="380" y1="270" x2="440" y2="338" marker-end="url(#a)"/>
<g class="n"><rect x="50" y="340" width="210" height="56" rx="8"/><text class="t" x="155" y="358" text-anchor="middle" dominant-baseline="central">Create AI</text><text class="s" x="155" y="378" text-anchor="middle" dominant-baseline="central">api-main, gpt6_luna</text></g>
<g class="n"><rect x="390" y="340" width="210" height="56" rx="8"/><text class="t" x="495" y="358" text-anchor="middle" dominant-baseline="central">Supabase</text><text class="s" x="495" y="378" text-anchor="middle" dominant-baseline="central">layer2-2027 search</text></g>
</g>
</svg>
