<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img">
<title>Desk manual database: the full picture</title>
<desc>One Postgres database with three schemas. The staging schema holds the next version of the manual, the live schema holds the published version, and the public schema holds the workflow tables. The web app edits staging, two approvers publish staging to live, and the assistant backend reads only live.</desc>
