<rect width="1500" height="900" fill="#ffffff"/>
<text class="h" x="40" y="30">Desk manual database: the full picture (planned, none created yet)</text>
<text class="lab" x="40" y="50">One Postgres database, three schemas. An arrow inside a box (→) marks a foreign key.</text>
<g class="x u"><rect x="250" y="70" width="240" height="52" rx="8"/><text class="t" x="370" y="88" text-anchor="middle" dominant-baseline="central">Web app</text><text class="s" x="370" y="106" text-anchor="middle" dominant-baseline="central">Design mockups only</text></g>
<g class="x"><rect x="1000" y="70" width="240" height="52" rx="8"/><text class="t" x="1120" y="88" text-anchor="middle" dominant-baseline="central">Assistant backend</text><text class="s" x="1120" y="106" text-anchor="middle" dominant-baseline="central">Runs today, not on the DB yet</text></g>
<rect x="20" y="150" width="1460" height="720" rx="14" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text class="lab" x="36" y="172">Postgres database</text>
<line class="arr dash" x1="370" y1="124" x2="370" y2="188" marker-end="url(#a)"/>
<text class="lab" x="382" y="160">edit, review, publish (role deskmanual_app, through functions)</text>
<line class="arr dash" x1="1120" y1="124" x2="1120" y2="188" marker-end="url(#a)"/>
<text class="lab" x="1132" y="160">read-only (role deskmanual_reader)</text>
<rect class="pn-d" x="40" y="190" width="660" height="320" rx="10"/>
<text class="pt" x="56" y="214" fill="#26215C">staging schema</text>
<text class="lab" x="170" y="214">The next version of the manual. Editing happens here.</text>
