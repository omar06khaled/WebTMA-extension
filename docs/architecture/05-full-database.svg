<text class="pt" x="56" y="584" fill="#085041">public schema</text>
<text class="lab" x="170" y="584">Workflow: who changed what, who approved it, which version is live. One copy, not versioned.</text>
<text class="gl" x="60" y="618">PROPOSED EDITS</text>
<g class="w"><rect x="60" y="628" width="220" height="44" rx="6"/>
<text class="t" x="70" y="644">change_set</text>
<text class="s" x="70" y="660">title · status · requested_by</text></g>
<g class="w"><rect x="60" y="680" width="220" height="44" rx="6"/>
<text class="t" x="70" y="696">change_request</text>
<text class="s" x="70" y="712">table · proposed · → change_set</text></g>
<g class="w"><rect x="60" y="732" width="220" height="44" rx="6"/>
<text class="t" x="70" y="748">change_request_event</text>
<text class="s" x="70" y="764">→ change_request · event</text></g>
<g class="w"><rect x="60" y="784" width="220" height="44" rx="6"/>
<text class="t" x="70" y="800">change_log</text>
<text class="s" x="70" y="816">table · old_row · new_row (auto)</text></g>
<text class="gl" x="300" y="618">PEOPLE</text>
<g class="w"><rect x="300" y="628" width="220" height="44" rx="6"/>
<text class="t" x="310" y="644">app_user</text>
<text class="s" x="310" y="660">asurite PK · role · active</text></g>
<g class="w"><rect x="300" y="680" width="220" height="44" rx="6"/>
<text class="t" x="310" y="696">role_change</text>
<text class="s" x="310" y="712">→ app_user · old → new role</text></g>
<text class="gl" x="630" y="618">PUBLISHING: STAGING → LIVE</text>
<g class="w"><rect x="630" y="628" width="220" height="44" rx="6"/>
<text class="t" x="640" y="644">release</text>
<text class="s" x="640" y="660">version PK · snapshot · is_live</text></g>
<g class="w"><rect x="630" y="680" width="220" height="44" rx="6"/>
<text class="t" x="640" y="696">release_request</text>
<text class="s" x="640" y="712">→ release · kind · status</text></g>
<g class="w"><rect x="630" y="732" width="220" height="44" rx="6"/>
<text class="t" x="640" y="748">release_event</text>
<text class="s" x="640" y="764">→ release · event · by</text></g>
<text class="gl" x="880" y="618">OTHER</text>
<g class="w"><rect x="880" y="628" width="220" height="44" rx="6"/>
<text class="t" x="890" y="644">manual_flag</text>
<text class="s" x="890" y="660">wo_number · target · → release</text></g>
<g class="w"><rect x="880" y="680" width="220" height="44" rx="6"/>
<text class="t" x="890" y="696">contact_unavailable</text>
<text class="s" x="890" y="712">contact_id · day · set_by</text></g>
<g class="w"><rect x="880" y="732" width="220" height="44" rx="6"/>
<text class="t" x="890" y="748">import_sheet</text>
<text class="s" x="890" y="764">sheet_name PK · target · status</text></g>
<g class="w"><rect x="880" y="784" width="220" height="44" rx="6"/>
<text class="t" x="890" y="800">campus</text>
<text class="s" x="890" y="816">code PK · name · shared by both</text></g>
<rect x="1130" y="604" width="310" height="226" rx="8" fill="#ffffff" stroke="#0F6E56" stroke-width="1" stroke-dasharray="4 4"/>
<text class="t" x="1146" y="628" fill="#085041">Rules the database enforces</text>
<text class="lab" x="1146" y="656" fill="#3d3d3a">•  Related edits are reviewed as one set</text>
<text class="lab" x="1146" y="678" fill="#3d3d3a">•  Nobody approves their own change</text>
<text class="lab" x="1146" y="700" fill="#3d3d3a">•  A denial needs a written reason</text>
<text class="lab" x="1146" y="722" fill="#3d3d3a">•  Publishing needs two different approvers</text>
<text class="lab" x="1146" y="744" fill="#3d3d3a">•  Rows are retired, never deleted</text>
<text class="lab" x="1146" y="766" fill="#3d3d3a">•  Logs can only be added to</text>
<text class="lab" x="1146" y="788" fill="#3d3d3a">•  Every release keeps a JSON snapshot</text>
<text class="lab" x="1146" y="810" fill="#3d3d3a">•  Any release can be rolled back</text>
<line class="arr" x1="170" y1="558" x2="170" y2="512" marker-end="url(#a)"/>
<text class="lab" x="182" y="540">approved edits are applied</text>
<line class="arr" x1="740" y1="558" x2="740" y2="364" marker-end="url(#a)"/>
<line class="arr dash" x1="1000" y1="558" x2="1000" y2="512" marker-end="url(#a)"/>
<text class="lab" x="1012" y="540">flags and off-today point at live rows</text>
<g class="m"><rect x="40" y="884" width="18" height="10" rx="2"/></g><text class="lab" x="64" y="893">manual data (versioned)</text>
<g class="w"><rect x="230" y="884" width="18" height="10" rx="2"/></g><text class="lab" x="254" y="893">workflow (one copy)</text>
<g class="x u"><rect x="390" y="884" width="18" height="10" rx="2"/></g><text class="lab" x="414" y="893">not built yet or not connected</text>
