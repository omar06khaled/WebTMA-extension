<svg xmlns="http://www.w3.org/2000/svg" width="680" height="390" viewBox="0 0 680 390" role="img">
<title>Planned desk manual database and web app</title>
<desc>A web app that does not exist yet would edit the staging tables of a Postgres database, two approvers would publish to the live tables, and the assistant backend would read only the live tables.</desc>
<style>
text{font-family:"Segoe UI",Arial,sans-serif}
.h{font-size:16px;font-weight:600;fill:#2C2C2A}
.t{font-size:14px;font-weight:600}
.s{font-size:12px}
.lab{font-size:12px;fill:#5F5E5A}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.dash{fill:none;stroke:#B4B2A9;stroke-width:1;stroke-dasharray:4 4}
.g rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:1}.g .t{fill:#085041}.g .s{fill:#0F6E56}
.n rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:1}.n .t{fill:#444441}.n .s{fill:#5F5E5A}
.u rect{stroke-dasharray:4 4}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="390" fill="#ffffff"/>
<text class="h" x="40" y="28">Planned: desk manual database (not built or connected yet)</text>
<g transform="translate(0,40)">
<g class="n u"><rect x="60" y="40" width="240" height="52" rx="8"/><text class="t" x="180" y="58" text-anchor="middle" dominant-baseline="central">Web app</text><text class="s" x="180" y="78" text-anchor="middle" dominant-baseline="central">Design mockups only</text></g>
<g class="g"><rect x="380" y="40" width="240" height="52" rx="8"/><text class="t" x="500" y="58" text-anchor="middle" dominant-baseline="central">Assistant backend</text><text class="s" x="500" y="78" text-anchor="middle" dominant-baseline="central">Runs, not on the DB yet</text></g>
<rect class="dash" x="40" y="170" width="600" height="130" rx="12"/>
<text class="lab" x="56" y="288">Postgres desk manual database (schema on the desk-manual-db branch, none created)</text>
<g class="n"><rect x="70" y="210" width="200" height="56" rx="8"/><text class="t" x="170" y="228" text-anchor="middle" dominant-baseline="central">staging</text><text class="s" x="170" y="248" text-anchor="middle" dominant-baseline="central">Next version of manual</text></g>
<g class="g"><rect x="410" y="210" width="200" height="56" rx="8"/><text class="t" x="510" y="228" text-anchor="middle" dominant-baseline="central">live</text><text class="s" x="510" y="248" text-anchor="middle" dominant-baseline="central">Published version</text></g>
<line class="arr" x1="274" y1="244" x2="406" y2="244" marker-end="url(#a)"/>
<text class="lab" x="340" y="228" text-anchor="middle">two approvers</text>
<line class="arr" x1="170" y1="94" x2="170" y2="206" stroke-dasharray="4 4" marker-end="url(#a)"/>
<text class="lab" x="182" y="150">edit + review</text>
<line class="arr" x1="510" y1="94" x2="510" y2="206" stroke-dasharray="4 4" marker-end="url(#a)"/>
<text class="lab" x="522" y="150">read-only</text>
</g>
</svg>
