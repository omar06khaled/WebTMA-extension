<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dispatch Lookup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: search panel on the left, the answer on the right; stacks on narrow screens. */
:root {
  --bg: #f2f4f6; --surface: #fff; --fg: #18212a; --muted: #5b6875; --line: #d9dfe5;
  --accent: #8c1d40; --accent-soft: #f6e6ec;
  --zone: #1f5fae; --zone-soft: #e3edf8; --trade: #1e7a46; --trade-soft: #e2f3e9;
  --note: #8a5a00; --note-soft: #fbf0d9; --none: #6b7580; --none-soft: #eceff2;
  --body: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #11161b; --surface: #1a2129; --fg: #e5ebf0; --muted: #98a5b1; --line: #2c3742;
  --accent: #e07a9b; --accent-soft: #3a1d28;
  --zone: #79aef0; --zone-soft: #1c2d42; --trade: #6fcf98; --trade-soft: #183225;
  --note: #e8b655; --note-soft: #362a12; --none: #9aa4ae; --none-soft: #252d35; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--body); }
header { background: var(--surface); border-bottom: 1px solid var(--line); padding: 14px 20px; display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; }
header h1 { font-size: 18px; margin: 0; font-weight: 600; }
header .meta { color: var(--muted); font-size: 13px; font-family: var(--mono); }
header .warn { margin-left: auto; font-size: 12.5px; color: var(--note); background: var(--note-soft); padding: 2px 10px; border-radius: 4px; }
.wrap { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 20px; padding: 20px; max-width: 1280px; margin: 0 auto; }
@media (max-width: 820px) { .wrap { grid-template-columns: 1fr; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 16px; align-self: start; }
label.h { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 6px; }
input[type=search] { width: 100%; font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.list { list-style: none; margin: 6px 0 0; padding: 0; max-height: 260px; overflow-y: auto; border: 1px solid var(--line); border-radius: 6px; }
.list:empty { display: none; }
.list button { all: unset; display: block; width: 100%; box-sizing: border-box; padding: 7px 10px; cursor: pointer; font-size: 14px; }
.list li + li button { border-top: 1px solid var(--line); }
.list button:hover, .list button:focus-visible { background: var(--accent-soft); }
.list small { color: var(--muted); font-family: var(--mono); font-size: 12px; }
.chosen { margin-top: 8px; padding: 8px 10px; background: var(--accent-soft); border-radius: 6px; display: flex; justify-content: space-between; gap: 8px; align-items: center; font-size: 14px; }
.chosen button { all: unset; cursor: pointer; color: var(--muted); font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { font: inherit; font-size: 13px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
.chips button[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: #fff; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
main { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 8px; padding: 32px; color: var(--muted); text-align: center; }
.title h2 { margin: 0; font-size: 22px; font-weight: 600; text-wrap: balance; }
.title p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.title code, td code { font-family: var(--mono); font-size: 13px; }
.answers { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.ans { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.ans .lbl { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.ans .to { font-size: 22px; font-weight: 600; font-family: var(--mono); }
.ans p { margin: 0; font-size: 13.5px; color: var(--muted); }
.k { display: inline-block; font-family: var(--mono); font-size: 11.5px; padding: 1px 8px; border-radius: 4px; width: fit-content; }
.k.zone { background: var(--zone-soft); color: var(--zone); } .k.trade { background: var(--trade-soft); color: var(--trade); }
.k.see_note { background: var(--note-soft); color: var(--note); } .k.not_handled { background: var(--none-soft); color: var(--none); }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
.box h3 { margin: 0 0 6px; font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.box .txt { white-space: pre-wrap; font-size: 14px; }
.box.notes { border-left: 3px solid var(--note); }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 600; }
tr.here td { background: var(--accent-soft); }
.err { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Dispatch Lookup</h1>
  <span class="meta" id="meta">connecting…</span>
  <span class="warn">Local preview · read only</span>
</header>
<div class="wrap">
  <aside class="panel">
    <div>
      <label class="h" for="task-q">1 · Task</label>
      <input type="search" id="task-q" placeholder="lock, hot call, 27070, Plumbing…" autocomplete="off">
      <ul class="list" id="task-list"></ul>
      <div id="task-chosen"></div>
    </div>
    <div>
      <label class="h" for="bldg-q">2 · Building (optional)</label>
      <input type="search" id="bldg-q" placeholder="157A, Hayden, Memorial Union…" autocomplete="off">
      <ul class="list" id="bldg-list"></ul>
      <div id="bldg-chosen"></div>
    </div>
    <div>
      <span class="h" style="display:block;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px">Or campus</span>
      <div class="chips" id="campus" role="group" aria-label="Campus"></div>
      <p class="hint" style="margin-top:8px">A building sets the campus for you. With no building and no campus, all four campuses show.</p>
    </div>
  </aside>
  <main id="out"><div class="empty">Pick a task to see who gets the call.</div></main>
</div>
<script>
const CAMPUS = { dtpc: "DTPC", poly: "POLY", tempe: "Tempe", west: "West" };
const KIND = { zone: "zone", trade: "trade", see_note: "see note", not_handled: "not handled" };
const st = { task: null, building: null, campus: null };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const get = async url => { const r = await fetch(url); const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status); return j; };

get("/api/stats").then(s => $("meta").textContent = `live v${s.version} · ${s.buildings} buildings · ${s.tasks} tasks`)
  .catch(e => { $("meta").textContent = e.message; $("meta").classList.add("err"); });

function debounce(fn, ms = 180) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

$("task-q").addEventListener("input", debounce(async e => {
  const q = e.target.value.trim();
  if (!q) return $("task-list").innerHTML = "";
  const rows = await get("/api/tasks?q=" + encodeURIComponent(q));
  $("task-list").innerHTML = rows.map(r => `<li><button type="button" data-t="${esc(r.description)}" data-cat="${esc(r.category)}">${esc(r.description)}<br><small>${esc(r.task_code ?? "no code")} · ${esc(r.category)}</small></button></li>`).join("")
    || '<li><button type="button" disabled>No match</button></li>';
}));
$("task-list").addEventListener("click", e => { const b = e.target.closest("button[data-t]"); if (!b) return;
  st.task = b.dataset.t; st.category = b.dataset.cat; $("task-q").value = ""; $("task-list").innerHTML = ""; chosen(); run(); });

$("bldg-q").addEventListener("input", debounce(async e => {
  const q = e.target.value.trim();
  if (!q) return $("bldg-list").innerHTML = "";
  const rows = await get("/api/buildings?q=" + encodeURIComponent(q));
  $("bldg-list").innerHTML = rows.map(r => `<li><button type="button" data-b="${esc(r.code)}">${esc(r.name)}<br><small>${esc(r.code)} · ${esc(CAMPUS[r.campus_code] || "no campus")}</small></button></li>`).join("")
    || '<li><button type="button" disabled>No match</button></li>';
}));
$("bldg-list").addEventListener("click", e => { const b = e.target.closest("button[data-b]"); if (!b) return;
  st.building = b.dataset.b; $("bldg-q").value = ""; $("bldg-list").innerHTML = ""; chosen(); run(); });

function chosen() {
  $("task-chosen").innerHTML = st.task ? `<div class="chosen"><span>${esc(st.task)} <small style="color:var(--muted)">· ${esc(st.category)}</small></span><button type="button" data-clear="task">Clear</button></div>` : "";
  $("bldg-chosen").innerHTML = st.building ? `<div class="chosen"><span>${esc(st.building)}</span><button type="button" data-clear="building">Clear</button></div>` : "";
  $("campus").innerHTML = Object.entries(CAMPUS).map(([k, v]) => `<button type="button" data-c="${k}" aria-pressed="${st.campus === k}">${v}</button>`).join("");
}
document.addEventListener("click", e => {
  const c = e.target.closest("[data-clear]"); if (c) { st[c.dataset.clear] = null; chosen(); run(); }
  const k = e.target.closest("button[data-c]"); if (k) { st.campus = st.campus === k.dataset.c ? null : k.dataset.c; chosen(); run(); }
});
chosen();

function sendTo(a) {
  if (a.kind === "trade") return esc(a.trade);
  if (a.kind === "zone") return a.zones ? (a.zones.length ? esc(a.zones.join(" / ")) : "Zone (building has none)") : "Building's zone";
  if (a.kind === "see_note") return "See notes";
  return "Not handled";
}

async function run() {
  if (!st.task) return $("out").innerHTML = '<div class="empty">Pick a task to see who gets the call.</div>';
  let d;
  try {
    const p = new URLSearchParams({ task: st.task, category: st.category });
    if (st.building) p.set("building", st.building);
    if (st.campus) p.set("campus", st.campus);
    d = await get("/api/route?" + p);
    if (d.error) throw new Error(d.error);
  } catch (e) { return $("out").innerHTML = `<div class="empty err">${esc(e.message)}</div>`; }
  const t = d.task, b = d.building;
  const where = b ? `${esc(b.name)} <code>${esc(b.code)}</code> · ${esc(CAMPUS[b.campus_code] || "no campus on file")}` : d.campus ? CAMPUS[d.campus] : "All campuses";
  let html = `<div class="title"><h2>${esc(t.description)}</h2><p><code>${esc(t.code ?? "no code")}</code> · ${esc(t.category)}${t.custodial ? " · custodial" : ""} · ${where}</p></div>`;
  html += '<div class="answers">' + d.answers.map(a => `<div class="ans">
      <span class="lbl">${esc(CAMPUS[a.campus])} · ${a.is_rfmt ? "RFMT" : "Regular"} WO</span>
      <span class="to">${sendTo(a)}</span>
      <span class="k ${a.kind}">${KIND[a.kind]}</span>
      ${a.instruction ? `<p>${esc(a.instruction)}</p>` : ""}
      ${a.kind === "zone" && !(a.zones && a.zones.length) && a.zone_options ? `<p>Zones on this campus:${esc(a.zone_options.join(", "))}</p>` : ""}
    </div>`).join("") + "</div>";
  if (b && b.campus_code === null) html += `<div class="box notes"><h3>Building</h3><div class="txt">This building has no campus on file, so every campus is shown.</div></div>`;
  if (b && b.notes && b.notes.length) html += `<div class="box notes"><h3>Building notes</h3><div class="txt">${esc(b.notes.join("\n\n"))}</div></div>`;
  if (t.section_note) html += `<div class="box notes"><h3>${esc(t.category)} section note</h3><div class="txt">${esc(t.section_note)}</div></div>`;
  if (t.notes) html += `<div class="box notes"><h3>Task notes</h3><div class="txt">${esc(t.notes)}</div></div>`;
  if (d.general_note) html += `<div class="box"><h3>General notes after ${esc(t.category)}</h3><div class="txt">${esc(d.general_note)}</div></div>`;
  html += `<div class="box"><h3>All eight cells</h3><div class="scroll"><table><thead><tr><th>Campus</th><th>Type</th><th>Kind</th><th>Trade</th><th>Zone options</th></tr></thead><tbody>` +
    d.grid.map(r => `<tr class="${r.campus_code === d.campus ? "here" : ""}"><td>${esc(CAMPUS[r.campus_code])}</td><td>${r.is_rfmt ? "RFMT" : "Regular"}</td><td><span class="k ${r.kind}">${KIND[r.kind]}</span></td><td><code>${esc(r.trade_code || "")}</code></td><td>${esc((r.zone_options || []).join(", "))}</td></tr>`).join("") +
    "</tbody></table></div></div>";
  $("out").innerHTML = html;
}
</script>
</body>
</html>
