<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lookups on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.ph{--bg:#F6F5F2;--surface:#FFFFFF;--soft:#F1EFEB;--text:#1F1F1F;--muted:#55524D;--line:#E4E1DC;--line2:#8A867F;--mark:#8C1D40;--solid:#1F1F1F;--stext:#FFFFFF;width:390px;height:844px;box-sizing:border-box;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Public Sans',system-ui,sans-serif;font-size:16px;line-height:1.5;display:flex;flex-direction:column;border-top:4px solid #FFC627}
.ph.dim{--bg:#1C1D20;--surface:#26282C;--soft:#303236;--text:#E9E6E1;--muted:#B3AEA6;--line:#3A3C41;--line2:#8E8981;--mark:#FFC627;--solid:#E9E6E1;--stext:#1C1D20}
:focus-visible{outline:3px solid var(--text);outline-offset:2px}
.in{font:inherit;font-size:16px;min-height:48px;box-sizing:border-box;padding:0 12px;border:1.5px solid var(--line2);border-radius:8px;background:var(--surface);color:var(--text);width:100%}
.call{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:8px;font-weight:700;font-size:16px;text-decoration:none}
.tb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:60px;font-size:13px;color:var(--text);text-decoration:none;border-top:3px solid transparent}
</style>
</helmet>
<div class="ph {{ themeClass }}">
<header style="background:var(--surface);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;justify-content:space-between">
<span style="font-size:18px;font-weight:700">Lookups</span>
<button type="button" aria-pressed="{{ dimPressed }}" onClick="{{ toggleTheme }}" style="min-height:44px;padding:0 12px;border:1.5px solid var(--line2);border-radius:8px;background:transparent;color:var(--text);font:inherit;font-size:14px;font-weight:600;cursor:pointer">{{ themeLabel }}</button>
</header>
<div style="padding:16px;display:flex;flex-direction:column;gap:16px;flex:1 1 auto;overflow:hidden">
<div style="display:flex;flex-direction:column;gap:6px"><label for="mt" style="font-weight:600;font-size:15px">Trade</label><select id="mt" class="in"><option>ZONE (zone maintenance)</option><option>EMS</option><option>LOCK</option></select></div>
<div style="display:flex;flex-direction:column;gap:6px"><label for="mb" style="font-weight:600;font-size:15px">Building</label><input id="mb" type="search" class="in" value="Wrigley Hall"></div>
<div><span style="font-size:14px;color:var(--muted)">Goes to</span><div style="font-size:20px;font-weight:700">Tempe · ACAD A zone</div></div>
<div style="background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:4px">
<span style="font-size:14px;color:var(--muted)">Call first · business hours</span>
<span style="font-size:19px;font-weight:700">[Supervisor 1]</span>
<a href="#" class="call" style="margin-top:8px;background:var(--solid);color:var(--stext)">Call [cell number]</a>
</div>
<div style="background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:4px">
<span style="font-size:14px;color:var(--muted)">If no answer</span>
<span style="font-size:18px;font-weight:700">[Supervisor 2]</span>
<a href="#" class="call" style="margin-top:8px;border:1.5px solid var(--line2);color:var(--text)">Call [cell number]</a>
</div>
</div>
<nav aria-label="Main" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--surface);border-top:1px solid var(--line)">
<a href="#" class="tb" aria-current="page" style="font-weight:700;border-top-color:var(--mark)">Lookups</a>
<a href="#" class="tb">Emergencies</a>
<a href="#" class="tb">Manual</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dim"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { dim: null }; }
renderVals() {
const dim = this.state.dim ?? ((this.props.theme ?? 'light') === 'dim');
return { themeClass: dim ? 'dim' : '', dimPressed: dim ? 'true' : 'false', themeLabel: dim ? 'Dim: on' : 'Dim: off', toggleTheme: () => this.setState({ dim: !dim }) };
}
}
</script>
</body>
</html>
